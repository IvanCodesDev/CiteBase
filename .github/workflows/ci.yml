name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装(含 dev 依赖)
        run: pip install -e ".[dev]"

      - name: Ruff 静态检查
        run: python -m ruff check .

      - name: Mypy 类型检查
        run: python -m mypy

      - name: 单元测试
        run: python -m pytest tests -q

      # 示例库质量门拆成单命令 step:Windows 默认 shell(pwsh)的多行 run
      # 不会因中间某行失败而中断,拆开才能保证两平台行为一致。
      - name: 示例库质量门 lint
        run: vault lint --vault examples/generic-basics

      - name: 示例库质量门 index（L-IDX-1 一致性）
        run: vault index --check --vault examples/generic-basics

      - name: 示例库质量门 eval
        run: vault eval --vault examples/generic-basics --min-hit 0.8 --min-first 0.8

      - name: 自举库质量门 lint
        run: vault lint --vault examples/citebase-self

      - name: 自举库质量门 index（L-IDX-1 一致性）
        run: vault index --check --vault examples/citebase-self

      - name: 自举库质量门 eval
        run: vault eval --vault examples/citebase-self --min-hit 0.8 --min-first 0.8
